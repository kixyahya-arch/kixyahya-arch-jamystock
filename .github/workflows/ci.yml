name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://jamystock:jamystock@localhost:5432/jamystock_test
      TEST_APP_DATABASE_URL: postgres://jamystock_api:jamystock_api@localhost:5432/jamystock_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Base de test
        run: PSQL="psql -v ON_ERROR_STOP=1" ./scripts/dev-db.sh jamystock_test
      - run: pnpm --filter @jamystock/domain build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
