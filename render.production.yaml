# Site RÉEL JAMYSTOCK sur Render (Blueprint) : Dashboard Render > New > Blueprint > ce dépôt,
# puis « Blueprint Path » = render.production.yaml. Indépendant de la démo (render.yaml) : autre base, autre service.
# Au premier démarrage, provision.js crée l'organisation, le dépôt et l'administrateur INIT_ADMIN_EMAIL,
# et écrit son lien d'activation dans le journal de déploiement (et par e-mail si Brevo est configuré).
# Coût indicatif : base basic-256mb (~6 $/mois) + service starter (~7 $/mois) + disque 10 Go (~2,5 $/mois).
databases:
  - name: jamystock-prod-db
    plan: basic-256mb # sauvegardes quotidiennes, pas d'expiration
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: jamystock
    user: jamystock_owner
    ipAllowList: [] # pas d'accès depuis Internet : seul le service web s'y connecte

services:
  - type: web
    name: jamystock-prod
    runtime: node
    plan: starter # toujours éveillé, nécessaire pour le disque
    region: frankfurt
    branch: main
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 build
    startCommand: node apps/api/dist/src/db/provision.js && node apps/api/dist/src/main.js
    healthCheckPath: /health
    disk:
      name: photos
      mountPath: /var/data
      sizeGB: 10 # ~4 400 photos reprises (~2 Go après réduction) + photos du terrain ; agrandissable à chaud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: jamystock-prod-db
          property: connectionString
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Pas de SEED_DEMO : aucune donnée fictive.
      # E-mail du premier administrateur (demandé à la création) ; ne sert qu'au premier démarrage.
      - key: INIT_ADMIN_EMAIL
        sync: false
      - key: INIT_ORG_NOM
        value: JAMYSTOCK
      # E-mails (invitations, confirmations) et paiement en ligne, à renseigner dans le tableau de bord
      - key: BREVO_API_KEY
        sync: false
      # Visuels d'aménagement des packs par IA (Higgsfield) : sans clé, seule l'image ajoutée à la main est proposée
      - key: HIGGSFIELD_API_KEY_ID
        sync: false
      - key: HIGGSFIELD_API_KEY_SECRET
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_DIST
        value: apps/client/dist
      - key: TERRAIN_DIST
        value: apps/terrain/dist
      - key: ADMIN_DIST
        value: apps/admin/dist
      # Photos sur le disque persistant : elles survivent aux redémarrages et aux déploiements
      - key: STORAGE_DIR
        value: /var/data/storage
